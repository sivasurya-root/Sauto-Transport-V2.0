spring.application.name=sauto-api
server.port=${PORT:8080}

# Local development uses an in-memory H2 database. Set SAUTO_DATABASE_URL to a MySQL URL for deployment.
spring.datasource.url=${SAUTO_DATABASE_URL:jdbc:h2:mem:sauto;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SAUTO_DATABASE_USERNAME:sa}
spring.datasource.password=${SAUTO_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Set SAUTO_CORS_ORIGINS to your GitHub Pages origin and local development origin(s), comma separated.
sauto.cors-origins=${SAUTO_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
sauto.token-hours=${SAUTO_TOKEN_HOURS:12}
