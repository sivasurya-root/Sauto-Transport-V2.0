<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f1" />
    <meta name="description" content="Sauto — a simple workspace for vehicles, drivers, documents and payments." />
    <title>Sauto — Transport operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M17 10v3h4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.25"/><path d="M3.5 19v-1.2a5.5 5.5 0 0 1 11 0V19zM16 5.3a3.2 3.2 0 0 1 0 6.1M17 14.1a4.5 4.5 0 0 1 3.5 4.4V19h-3"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4.5 4.6V20a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.8V9h4.2M9 13h6M9 16.5h6"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6.5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h12"/><path d="M3 9h17M16 14.5h4"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3.5 8 5l2-1.5L12 5l2-1.5L16 5l2-1.5v16l-2-1.5-2 1.5-2-1.5-2 1.5L8 19l-2 1.5z"/><path d="M9 9h6M9 12.5h6M9 16h3"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19.5h16M5.5 16l4-4 3 2.5 5.5-6"/><path d="M15 8.5h3v3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.3 4.3"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 9h17C20.5 16 18 16 18 9zM10 21h4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.4 4.2L19.5 6.8"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M5 17v3h14v-3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 13.5 1.2.9-1.4 2.5-1.5-.6a7.8 7.8 0 0 1-1.6.9l-.3 1.6h-2.9l-.3-1.6a7.8 7.8 0 0 1-1.6-.9l-1.5.6-1.4-2.5 1.2-.9a7.3 7.3 0 0 1 0-1.9l-1.2-.9 1.4-2.5 1.5.6a7.8 7.8 0 0 1 1.6-.9l.3-1.6h2.9l.3 1.6a7.8 7.8 0 0 1 1.6.9l1.5-.6 1.4 2.5-1.2.9a7.3 7.3 0 0 1 0 1.9z"/></symbol>
    </svg>

    <div class="app-shell" id="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="Sauto home">
          <img class="brand-logo" src="./sauto-original-logo.png" alt="Sauto Auto Transport" />
        </a>
        <div class="workspace-switcher">
          <div class="workspace-avatar">ST</div>
          <div class="workspace-copy"><strong>Sauto Transport</strong><small>Operations team</small></div>
          <svg class="icon small"><use href="#i-chevron"/></svg>
        </div>
        <p class="nav-label">WORKSPACE</p>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-nav="dashboard"><svg class="icon"><use href="#i-grid"/></svg><span>Overview</span><span class="nav-dot"></span></button>
          <button class="nav-item" data-nav="fleet"><svg class="icon"><use href="#i-truck"/></svg><span>Vehicles</span><span class="nav-count" id="vehicle-count">24</span></button>
          <button class="nav-item" data-nav="drivers"><svg class="icon"><use href="#i-users"/></svg><span>Drivers</span></button>
          <button class="nav-item" data-nav="documents"><svg class="icon"><use href="#i-file"/></svg><span>Documents</span><span class="nav-alert">3</span></button>
          <button class="nav-item" data-nav="payments"><svg class="icon"><use href="#i-wallet"/></svg><span>Payments</span></button>
          <button class="nav-item" data-nav="billing"><svg class="icon"><use href="#i-receipt"/></svg><span>Billing</span></button>
          <button class="nav-item" data-nav="reports"><svg class="icon"><use href="#i-chart"/></svg><span>Reports</span></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-health">
          <div class="health-top"><span class="health-icon"><svg class="icon"><use href="#i-truck"/></svg></span><span class="health-live"><i></i> VEHICLE STATUS</span></div>
          <strong><span id="active-fleet-count">18</span> vehicles ready</strong>
          <div class="health-track"><span id="fleet-health-bar" style="width:76%"></span></div>
          <small>Ready to go <b id="fleet-health-value">76%</b></small>
        </div>
        <button class="profile-button" data-action="profile">
          <span class="profile-avatar">AM</span><span class="profile-copy"><strong>Alex Morgan</strong><small>Transport manager</small></span>
          <svg class="icon small"><use href="#i-more"/></svg>
        </button>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu icon-button" data-action="menu" aria-label="Open menu"><span class="hamburger"></span></button>
          <a class="mobile-brand" href="#dashboard" data-nav="dashboard" aria-label="Sauto home"><img src="./sauto-original-logo.png" alt="Sauto Auto Transport" /></a>
          <div class="breadcrumbs"><span>Workspace</span><svg class="icon tiny"><use href="#i-chevron"/></svg><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><svg class="icon"><use href="#i-search"/></svg><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search anything"/><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" data-action="notifications" aria-label="Notifications"><svg class="icon"><use href="#i-bell"/></svg><i></i></button>
            <button class="demo-pill" data-action="connection"><span class="demo-dot"></span><span id="connection-label">Demo mode</span><svg class="icon tiny"><use href="#i-chevron"/></svg></button>
          </div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite"></section>
        <footer class="app-footer"><span>© 2026 Sauto Transport</span><span><i></i> All systems operational</span><a href="https://github.com/sivasurya-root/Sauto-Transport" target="_blank" rel="noreferrer">Backend reference <svg class="icon tiny"><use href="#i-arrow"/></svg></a></footer>
      </main>
      <nav class="mobile-tabbar" aria-label="Main navigation">
        <button class="mobile-tab active" data-nav="dashboard"><svg class="icon"><use href="#i-grid"/></svg><span>Home</span></button>
        <button class="mobile-tab" data-nav="fleet"><svg class="icon"><use href="#i-truck"/></svg><span>Vehicles</span></button>
        <button class="mobile-tab" data-nav="drivers"><svg class="icon"><use href="#i-users"/></svg><span>Drivers</span></button>
        <button class="mobile-tab" data-action="more-nav" aria-expanded="false"><svg class="icon"><use href="#i-more"/></svg><span>More</span></button>
      </nav>
      <div class="mobile-more-backdrop" data-action="close-more-nav">
        <section class="mobile-more-sheet" aria-label="More sections">
          <div class="sheet-grabber"></div>
          <div class="sheet-heading"><strong>More tools</strong><button class="icon-button" data-action="close-more-nav" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button></div>
          <button class="more-link" data-nav="documents"><span class="more-icon"><svg class="icon"><use href="#i-file"/></svg></span><span><strong>Documents</strong><small>Expiry dates and renewals</small></span><svg class="icon small"><use href="#i-chevron"/></svg></button>
          <button class="more-link" data-nav="payments"><span class="more-icon"><svg class="icon"><use href="#i-wallet"/></svg></span><span><strong>Payments</strong><small>Supplier costs and due dates</small></span><svg class="icon small"><use href="#i-chevron"/></svg></button>
          <button class="more-link" data-nav="billing"><span class="more-icon"><svg class="icon"><use href="#i-receipt"/></svg></span><span><strong>Billing</strong><small>Invoices and collections</small></span><svg class="icon small"><use href="#i-chevron"/></svg></button>
          <button class="more-link" data-nav="reports"><span class="more-icon"><svg class="icon"><use href="#i-chart"/></svg></span><span><strong>Reports</strong><small>Activity and money in one view</small></span><svg class="icon small"><use href="#i-chevron"/></svg></button>
        </section>
      </div>
      <div class="mobile-scrim" data-action="close-menu"></div>
      <div id="modal-root"></div>
      <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
